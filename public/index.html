<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wavzyy — Free &amp; Open-Source Speed Test</title>
  <style>
    :root {
      --bg: #0b1020;
      --card: #121a30;
      --border: #233055;
      --text: #f3f6ff;
      --muted: #9aa7c7;
      --accent: #38bdf8;
      --err: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: radial-gradient(circle at top, #132044, var(--bg) 60%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
    }
    header {
      width: 100%;
      max-width: 760px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
    }
    .brand { font-size: 1.35rem; font-weight: 700; letter-spacing: -0.02em; }
    .brand span { color: var(--accent); }
    .badge {
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.14);
      border: 1px solid rgba(56, 189, 248, 0.35);
      color: var(--accent);
    }
    main {
      width: 100%;
      max-width: 760px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    .go-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin: 12px 0;
    }
    #goBtn {
      width: 156px;
      height: 156px;
      border-radius: 50%;
      border: 3px solid var(--accent);
      background: radial-gradient(circle, rgba(56, 189, 248, 0.22), rgba(18, 26, 48, 0.95));
      color: var(--text);
      font-size: 2rem;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.2s ease;
      box-shadow: 0 0 36px rgba(56, 189, 248, 0.22);
    }
    #goBtn:hover:not(:disabled) { transform: scale(1.04); box-shadow: 0 0 48px rgba(56, 189, 248, 0.4); }
    #goBtn:disabled { opacity: 0.7; cursor: wait; }
    #statusText { color: var(--muted); font-size: 0.95rem; min-height: 22px; text-align: center; }
    #statusText.error { color: var(--err); }
    .grid {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
    }
    .metric {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      text-align: center;
    }
    .metric-label { font-size: 0.78rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
    .metric-value { font-size: 1.85rem; font-weight: 700; margin-top: 6px; }
    .metric-unit { font-size: 0.8rem; color: var(--muted); }
    .card {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px 20px;
      display: none;
    }
    .card.visible { display: block; }
    .card h2 { font-size: 1rem; margin-bottom: 8px; color: var(--accent); }
    .card p { font-size: 0.94rem; line-height: 1.5; color: var(--text); white-space: pre-line; }
    .tips { margin-top: 10px; padding-left: 18px; color: var(--muted); font-size: 0.9rem; line-height: 1.5; }
    footer {
      margin-top: auto;
      padding-top: 32px;
      font-size: 0.8rem;
      color: var(--muted);
      text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">wavzyy<span>.in</span></div>
    <div class="badge">Free &amp; Open-Source</div>
  </header>

  <main>
    <div class="go-wrap">
      <button id="goBtn" type="button">GO</button>
      <div id="statusText">Tap GO to test download, upload, ping &amp; AI diagnostics</div>
    </div>

    <div class="grid">
      <div class="metric">
        <div class="metric-label">Download</div>
        <div class="metric-value" id="dlVal">--</div>
        <div class="metric-unit">Mbps</div>
      </div>
      <div class="metric">
        <div class="metric-label">Upload</div>
        <div class="metric-value" id="ulVal">--</div>
        <div class="metric-unit">Mbps</div>
      </div>
      <div class="metric">
        <div class="metric-label">Ping</div>
        <div class="metric-value" id="pingVal">--</div>
        <div class="metric-unit">ms</div>
      </div>
      <div class="metric">
        <div class="metric-label">Jitter</div>
        <div class="metric-value" id="jitterVal">--</div>
        <div class="metric-unit">ms</div>
      </div>
    </div>

    <section class="card" id="aiCard">
      <h2 id="aiGrade">AI Connection Doctor</h2>
      <p id="aiSummary"></p>
      <ul class="tips" id="aiTips"></ul>
    </section>
  </main>

  <footer>
    Powered by Cloudflare Workers &amp; Open Source &middot; <span id="metaInfo">Ready</span>
  </footer>

  <script>
    const goBtn = document.getElementById("goBtn");
    const statusText = document.getElementById("statusText");
    const dlVal = document.getElementById("dlVal");
    const ulVal = document.getElementById("ulVal");
    const pingVal = document.getElementById("pingVal");
    const jitterVal = document.getElementById("jitterVal");
    const aiCard = document.getElementById("aiCard");
    const aiGrade = document.getElementById("aiGrade");
    const aiSummary = document.getElementById("aiSummary");
    const aiTips = document.getElementById("aiTips");
    const metaInfo = document.getElementById("metaInfo");

    async function runTest() {
      goBtn.disabled = true;
      goBtn.textContent = "...";
      statusText.className = "";
      aiCard.classList.remove("visible");
      dlVal.textContent = "--";
      ulVal.textContent = "--";
      pingVal.textContent = "--";
      jitterVal.textContent = "--";

          const t0 = performance.now();
          const res = await fetch(`/api/ping?t=${Date.now()}_${i}`, { cache: "no-store" });
          if (!res.ok) throw new Error(`Ping failed (HTTP ${res.status})`);
          const data = await res.json();
          colo = data.colo || colo;
          isp = data.isp || isp;
          pings.push(performance.now() - t0);
        }

        const measured = pings.slice(1);
        const pingMs = measured.reduce((a, b) => a + b, 0) / measured.length;
        const jitterMs =
          measured.slice(1).reduce((acc, v, idx) => acc + Math.abs(v - measured[idx]), 0) /
          Math.max(measured.length - 1, 1);

        pingVal.textContent = pingMs.toFixed(0);
        jitterVal.textContent = jitterMs.toFixed(1);
        metaInfo.textContent = `Node: ${colo} · ${isp}`;

        const dlStart = performance.now();
        const dlRes = await fetch(`/api/download?bytes=15728640&r=${Date.now()}`, { cache: "no-store" });
        if (!dlRes.ok || !dlRes.body) throw new Error(`Download failed (HTTP ${dlRes.status})`);

        let dlBytes = 0;
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          dlBytes += value.byteLength;
          const sec = Math.max((performance.now() - dlStart) / 1000, 0.05);
          dlVal.textContent = ((dlBytes * 8) / (sec * 1_000_000)).toFixed(1);
        }
